// android/app/build.gradle
// WebView 壳：只装一个 Activity，页面来自 Vite 开发服务器或打包进 assets 的 Web 构建。
plugins {
    id 'com.android.application'
}

android {
    namespace 'top.izuna.foliamajor.shell'
    compileSdk 36
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId 'team.bhe.foliadroid'
        minSdk 26
        targetSdk 35
        versionCode 7029
        versionName '0.7.29'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    // 出三个包：arm64-v8a（真机）、x86_64（模拟器），再一个 universal 给不确定架构的人。
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            // 110MB 的 libnode.so 没必要在安装时再解压一份。
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media:media:1.7.0'
}
